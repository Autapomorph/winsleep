name: Build release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New Version"
        required: true
      force_version:
        description: "Force specified version"
        required: false
        type: boolean
        default: false
      is_draft:
        description: "Create Draft Release"
        required: false
        type: boolean
        default: false
      is_major:
        description: "Major update"
        required: false
        type: boolean
        default: false
      force_npm_install:
        description: "Force fresh npm install"
        required: false
        type: boolean
        default: false
      force_cargo_clean:
        description: "Force cargo clean"
        required: false
        type: boolean
        default: false

run-name: Build release ${{ github.event.inputs.version }}

permissions:
  contents: read

jobs:
  validate_version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.normalize_new_version.outputs.new_version }}
      previous_version: ${{ steps.get_previous_version.outputs.previous_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest release version
        id: get_previous_version
        run: |
          PREVIOUS_VERSION=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          echo "Found previous version: $PREVIOUS_VERSION"
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

      - name: Normalize new version
        id: normalize_new_version
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          NORMALIZED_VERSION="${RAW_VERSION#v}"
          echo "new_version=$NORMALIZED_VERSION" >> $GITHUB_OUTPUT

      - name: Validate semantic version format
        id: validate_format
        uses: matt-usurp/validate-semver@v3
        with:
          version: ${{ steps.normalize_new_version.outputs.new_version }}

      - name: Validate version increment
        run: node scripts/validate-version-increment.js
        env:
          PREVIOUS_VERSION: ${{ steps.get_previous_version.outputs.previous_version }}
          NEW_VERSION: ${{ steps.normalize_new_version.outputs.new_version }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}

  build_release_bundle:
    needs: [validate_version]
    timeout-minutes: 30
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        id: cache-rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Clean Cargo artifacts
        if: steps.cache-rust.outputs.cache-hit != 'true' || github.event.inputs.force_cargo_clean == 'true'
        run: cargo clean
        working-directory: ./src-tauri

      - name: Force clean npm cache
        if: github.event.inputs.force_npm_install == 'true'
        run: |
          echo "Forcing fresh npm install"
          npm cache clean --force

      - name: Install dependencies (npm)
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Update version numbers
        id: update-versions
        shell: pwsh
        run: |
          node ./scripts/bump-version.js "${{ needs.validate_version.outputs.previous_version }}" "${{ needs.validate_version.outputs.new_version }}"

      - name: Create .env.production file
        shell: pwsh
        run: |
          # Example:
          # @"
          # KEY=$env:KEY
          # "@ | Set-Content .env.production
          New-Item -Path .env.production -ItemType File -Force
        # env:
        # KEY: ${{ secrets.KEY }}

      - name: Build and package Tauri app (${{ matrix.arch }})
        shell: pwsh
        run: |
          npm run tauri build -- --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CI: "1"

      - name: Package Portable archive (${{ matrix.arch }})
        shell: pwsh
        run: |
          $Version = "${{ needs.validate_version.outputs.new_version }}"
          $Arch = "${{ matrix.arch }}"
          $Target = "${{ matrix.target }}"
          $ExePath = "./src-tauri/target/$Target/release/WinSleep.exe"
          $PortableDir = "./src-tauri/target/$Target/release/portable"

          New-Item -ItemType Directory -Force -Path $PortableDir | Out-Null
          Copy-Item -Path $ExePath -Destination "$PortableDir/WinSleep.exe"
          New-Item -ItemType File -Force -Path "$PortableDir/.portable" | Out-Null
          Copy-Item -Path "./LICENSE" -Destination "$PortableDir/LICENSE"

          $BundleDir = "./src-tauri/target/$Target/release/bundle/nsis"
          New-Item -ItemType Directory -Force -Path $BundleDir | Out-Null
          $ZipPath = "$BundleDir/WinSleep_${Version}_${Arch}-portable.zip"
          Compress-Archive -Path "$PortableDir/*" -DestinationPath $ZipPath -Force

      - name: Upload artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: |
            ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/WinSleep_${{ needs.validate_version.outputs.new_version }}_${{ matrix.arch }}-setup.exe
            ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/WinSleep_${{ needs.validate_version.outputs.new_version }}_${{ matrix.arch }}-setup.exe.sig
            ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/WinSleep_${{ needs.validate_version.outputs.new_version }}_${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  publish_release:
    needs: [validate_version, build_release_bundle]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all bundles
        uses: actions/download-artifact@v7
        with:
          path: ./release-bundles
          merge-multiple: true

      - name: Organize bundles
        run: |
          find ./release-bundles -mindepth 2 -type f -exec mv -t ./release-bundles {} +
          find ./release-bundles -mindepth 1 -type d -empty -delete
          ls -la ./release-bundles

      - name: Update repository version numbers
        run: |
          node ./scripts/bump-version.js "${{ needs.validate_version.outputs.previous_version }}" "${{ needs.validate_version.outputs.new_version }}"

      - name: Update latest.json with signatures
        run: node scripts/update-latest-json.js
        env:
          NEW_VERSION: ${{ needs.validate_version.outputs.new_version }}
          IS_MAJOR: ${{ github.event.inputs.is_major }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create PR for version changes
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore(version): bump to ${{ needs.validate_version.outputs.new_version }}"
          title: "chore(version): bump to ${{ needs.validate_version.outputs.new_version }}"
          body: |
            Automated version bump for release [v${{ needs.validate_version.outputs.new_version }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate_version.outputs.new_version }})

            Generated by workflow run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Merging this PR allows the release to be distributed through Tauri Updater for auto-updates
          branch: "version-bump-${{ needs.validate_version.outputs.new_version }}-${{ github.run_id }}"
          base: "main"
          add-paths: |
            package.json
            package-lock.json
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            latest.json
          sign-commits: true

      - name: Generate release notes
        id: generate_notes
        run: node scripts/generate-release-notes.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEW_VERSION: ${{ needs.validate_version.outputs.new_version }}
          PREVIOUS_VERSION: ${{ needs.validate_version.outputs.previous_version }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate_version.outputs.new_version }}
          name: v${{ needs.validate_version.outputs.new_version }}
          body_path: ./release_notes.md
          draft: ${{ github.event.inputs.is_draft == 'true' }}
          files: |
            ./release-bundles/WinSleep_${{ needs.validate_version.outputs.new_version }}_x64-setup.exe
            ./release-bundles/WinSleep_${{ needs.validate_version.outputs.new_version }}_x64-setup.exe.sig
            ./release-bundles/WinSleep_${{ needs.validate_version.outputs.new_version }}_arm64-setup.exe
            ./release-bundles/WinSleep_${{ needs.validate_version.outputs.new_version }}_arm64-setup.exe.sig
            ./release-bundles/WinSleep_${{ needs.validate_version.outputs.new_version }}_x64-portable.zip
            ./release-bundles/WinSleep_${{ needs.validate_version.outputs.new_version }}_arm64-portable.zip

      - name: Cleanup bundle-x64 artifact
        if: always() && needs.build_release_bundle.result == 'success'
        uses: geekyeggo/delete-artifact@v6
        with:
          name: bundle-x64

      - name: Cleanup bundle-arm64 artifact
        if: always() && needs.build_release_bundle.result == 'success'
        uses: geekyeggo/delete-artifact@v6
        with:
          name: bundle-arm64
